<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" type="text/css" href="./css/stylesheet.css" />
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>
<body>
    <div class="calculator-container" >
        <div class="calculator-output">
            <p id="output"></p>
        </div>
        <div>
            <button type="button" data-number="del" class="num-btn">del</button>
            <button type="button" data-number="C" class="num-btn">C</button>
            <button type="button" data-number="%" class="num-btn">%</button>
            <button type="button" data-number="/" class="num-btn">/</button>
        </div>
        <div>
            <button type="button" data-number="7" class="num-btn">7</button>
            <button type="button" data-number="8" class="num-btn">8</button>
            <button type="button" data-number="9" class="num-btn">9</button>
            <button type="button" data-number="*" class="num-btn">x</button>
        </div>
        <div>
            <button type="button" data-number="4" class="num-btn">4</button>
            <button type="button" data-number="5" class="num-btn">5</button>
            <button type="button" data-number="6" class="num-btn">6</button>
            <button type="button" data-number="-" class="num-btn">-</button>
        </div>
        <div>
            <button type="button" data-number="1" class="num-btn">1</button>
            <button type="button" data-number="2" class="num-btn">2</button>
            <button type="button" data-number="3" class="num-btn">3</button>
            <button type="button" data-number="+" class="num-btn">+</button>
        </div>
        <div>
            <button type="button" data-number="+/-" class="num-btn">+/-</button>
            <button type="button" data-number="0" class="num-btn">0</button>
            <button type="button" data-number="." class="num-btn">.</button>
            <button type="button" data-number="=" class="num-btn">=</button>
        </div>
    </div>

    <script src="./js/calculator.js"></script>
</body>
</html>
